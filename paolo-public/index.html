<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nocap — NextGen European Deal Lawyers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #131F30;
      --paper: #FAF8F5;
      --coral: #E8927C;
      --line: #E3E0DA;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #FAF8F5;
      border-bottom: 1px solid #E3E0DA;
    }
    .nav-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: 72rem;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
    }
    .nav-left { justify-self: start; }
    .nav-center {
      display: flex;
      align-items: center;
      gap: 1.75rem;
    }
    .nav-right { justify-self: end; }
    .nav-mark { height: 22px; width: auto; display: block; }
    .nav-link {
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      opacity: 0.75;
    }
    .nav-link:hover { opacity: 1; }
    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1;
      border-radius: 100px;
      background: #131F30;
      color: #FAF8F5;
      padding: 0.55rem 0.95rem;
    }
    .home {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: calc(100vh - 61px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
    }
    .home-grad {
      position: absolute;
      inset: -30%;
      z-index: -2;
      background:
        radial-gradient(60% 55% at 20% 80%, #F0A88E 0%, rgba(240,168,142,0) 62%),
        radial-gradient(55% 50% at 80% 16%, #B9C6E4 0%, rgba(185,198,228,0) 62%),
        radial-gradient(70% 60% at 58% 58%, #F2CDBD 0%, rgba(242,205,189,0) 70%),
        #FAF8F5;
    }
    .home-cover {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: min(38rem, 86vw);
    }
    .home-mark {
      width: min(540px, 78vw);
      height: auto;
      display: block;
    }
    .home-tagline {
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(14px, 2vw, 18px);
      font-weight: 500;
      letter-spacing: 0.19em;
      text-transform: uppercase;
      color: #131F30;
      margin: 2.5rem 0 0;
    }
    .home-rule {
      width: 56px;
      height: 2px;
      margin: 1.75rem auto 0;
      background: #131F30;
    }
    .home-desc {
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.62;
      color: #131F30;
      text-align: center;
      margin: 1.75rem 0 0;
      max-width: 38rem;
    }
    @media (max-width: 768px) {
      .nav-center { display: none; }
    }
  </style>
